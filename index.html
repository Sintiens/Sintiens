<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sintiens — Un análisis crítico sobre nuestra relación con los animales, el impacto ambiental y los axiomas morales que la definen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>¿Qué vidas importan? — Un análisis crítico</title>
  </head>
  <body class="antialiased">
    <div id="root">
      <!-- Premium instant loading screen to prevent white flash during branch checkouts -->
      <style>
        .instant-loader-container {
          position: fixed;
          inset: 0;
          background: #09090b; /* Zinc-950 */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 999999;
          font-family: "Outfit", sans-serif;
          color: #fafafa;
        }
        .instant-loader-spinner {
          width: 42px;
          height: 42px;
          border: 3px solid rgba(244, 63, 94, 0.08); /* Rose spin container */
          border-radius: 50%;
          border-top-color: #f43f5e; /* Rose spinner */
          animation: instant-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          margin-bottom: 20px;
        }
        .instant-loader-title {
          font-size: 16px;
          font-weight: 700;
          letter-spacing: -0.025em;
          margin-bottom: 6px;
          background: linear-gradient(135deg, #fafafa 0%, #a1a1aa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .instant-loader-subtitle {
          font-size: 11px;
          color: #52525b; /* Zinc-600 */
          font-weight: 400;
          letter-spacing: 0.01em;
        }
        @keyframes instant-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="instant-loader-container">
        <div class="instant-loader-spinner"></div>
        <div class="instant-loader-title">Sintiens</div>
        <div class="instant-loader-subtitle">Conectando con el entorno de la IA...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
