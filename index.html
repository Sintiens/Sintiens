<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sintiens — Un análisis crítico sobre nuestra relación con los animales, el impacto ambiental y los axiomas morales que la definen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>¿Qué vidas importan? — Un análisis crítico</title>
  </head>
  <body class="antialiased">
    <div id="root">
      <!-- Premium instant loading screen to prevent white flash during branch checkouts -->
      <style>
        .instant-loader-container {
          position: fixed;
          inset: 0;
          background: #09090b; /* Zinc-950 */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 999999;
          font-family: "Outfit", sans-serif;
          color: #fafafa;
        }
        .instant-loader-logo {
          width: 48px;
          height: auto;
          margin-bottom: 20px;
          animation: instant-logo-pulse 2s ease-in-out infinite;
          filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.15));
        }
        .instant-loader-title {
          font-size: 16px;
          font-weight: 700;
          letter-spacing: -0.025em;
          margin-bottom: 6px;
          background: linear-gradient(135deg, #fafafa 0%, #a1a1aa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .instant-loader-subtitle {
          font-size: 11px;
          color: #52525b; /* Zinc-600 */
          font-weight: 400;
          letter-spacing: 0.01em;
        }
        @keyframes instant-logo-pulse {
          0%, 100% { opacity: 0.7; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.05); }
        }
      </style>
      <div class="instant-loader-container">
        <!-- Sintiens logo for branded loading experience -->
        <img class="instant-loader-logo" src="/logo-white-transparent.png" alt="Sintiens" />
        <div class="instant-loader-title">Sintiens</div>
        <div class="instant-loader-subtitle">Conectando con el entorno de la IA...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
