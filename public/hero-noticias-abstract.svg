<svg width="1440" height="600" viewBox="0 0 1440 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <!-- Abstract archival columns — evokes newspaper archive / museum catalog -->
  <!-- Designed to be used at opacity 0.05-0.08, grayscale, behind title. No texture, no noise. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top hairline masthead rule -->
    <g opacity="0.9">
      <line x1="40" y1="38" x2="1400" y2="38" stroke-width="0.7"/>
      <line x1="40" y1="41.5" x2="1400" y2="41.5" stroke-width="0.35"/>
    </g>
    <!-- Bottom hairline rule -->
    <g opacity="0.9">
      <line x1="40" y1="562" x2="1400" y2="562" stroke-width="0.35"/>
      <line x1="40" y1="565.5" x2="1400" y2="565.5" stroke-width="0.7"/>
    </g>
    <!-- Column 1 — left archive column (abstract text lines) -->
    <g opacity="1" stroke-width="1.1">
      <line x1="80" y1="92" x2="420" y2="92"/>
      <line x1="80" y1="108" x2="365" y2="108"/>
      <line x1="80" y1="124" x2="400" y2="124"/>
      <line x1="80" y1="140" x2="350" y2="140"/>
      <line x1="80" y1="156" x2="410" y2="156"/>
      <line x1="80" y1="172" x2="340" y2="172"/>
      <line x1="80" y1="188" x2="395" y2="188"/>
      <line x1="80" y1="204" x2="360" y2="204"/>
    </g>
    <g opacity="0.7" stroke-width="0.9">
      <line x1="80" y1="252" x2="385" y2="252"/>
      <line x1="80" y1="268" x2="355" y2="268"/>
      <line x1="80" y1="284" x2="405" y2="284"/>
      <line x1="80" y1="300" x2="340" y2="300"/>
      <line x1="80" y1="316" x2="390" y2="316"/>
    </g>
    <g opacity="0.45" stroke-width="0.9">
      <line x1="80" y1="364" x2="370" y2="364"/>
      <line x1="80" y1="380" x2="345" y2="380"/>
      <line x1="80" y1="396" x2="400" y2="396"/>
      <line x1="80" y1="412" x2="335" y2="412"/>
    </g>
    <!-- Column 2 — center (shorter, leaves clear space for title) -->
    <g opacity="0.55" stroke-width="1">
      <line x1="520" y1="92" x2="920" y2="92"/>
      <line x1="520" y1="108" x2="880" y2="108"/>
      <line x1="520" y1="124" x2="910" y2="124"/>
      <line x1="520" y1="140" x2="860" y2="140"/>
    </g>
    <g opacity="0.35" stroke-width="0.9">
      <line x1="520" y1="412" x2="900" y2="412"/>
      <line x1="520" y1="428" x2="865" y2="428"/>
      <line x1="520" y1="444" x2="915" y2="444"/>
      <line x1="520" y1="460" x2="850" y2="460"/>
    </g>
    <!-- Column 3 — right archive column -->
    <g opacity="1" stroke-width="1.1">
      <line x1="1020" y1="92" x2="1360" y2="92"/>
      <line x1="1020" y1="108" x2="1305" y2="108"/>
      <line x1="1020" y1="124" x2="1340" y2="124"/>
      <line x1="1020" y1="140" x2="1290" y2="140"/>
      <line x1="1020" y1="156" x2="1350" y2="156"/>
      <line x1="1020" y1="172" x2="1280" y2="172"/>
      <line x1="1020" y1="188" x2="1335" y2="188"/>
      <line x1="1020" y1="204" x2="1300" y2="204"/>
    </g>
    <g opacity="0.7" stroke-width="0.9">
      <line x1="1020" y1="252" x2="1325" y2="252"/>
      <line x1="1020" y1="268" x2="1295" y2="268"/>
      <line x1="1020" y1="284" x2="1345" y2="284"/>
      <line x1="1020" y1="300" x2="1280" y2="300"/>
      <line x1="1020" y1="316" x2="1330" y2="316"/>
    </g>
    <g opacity="0.45" stroke-width="0.9">
      <line x1="1020" y1="364" x2="1310" y2="364"/>
      <line x1="1020" y1="380" x2="1285" y2="380"/>
      <line x1="1020" y1="396" x2="1340" y2="396"/>
      <line x1="1020" y1="412" x2="1275" y2="412"/>
    </g>
    <!-- Subtle vertical column dividers -->
    <g opacity="0.35" stroke-width="0.6">
      <line x1="480" y1="72" x2="480" y2="490"/>
      <line x1="960" y1="72" x2="960" y2="490"/>
    </g>
    <!-- Small archival folio marks (like museum catalog) -->
    <g opacity="0.5" stroke-width="0.6">
      <rect x="80" y="62" width="18" height="14" rx="1"/>
      <line x1="85" y1="69" x2="93" y2="69"/>
      <rect x="1342" y="62" width="18" height="14" rx="1"/>
      <line x1="1347" y1="69" x2="1355" y2="69"/>
      <rect x="80" y="518" width="18" height="14" rx="1"/>
      <rect x="1342" y="518" width="18" height="14" rx="1"/>
    </g>
  </g>
</svg>